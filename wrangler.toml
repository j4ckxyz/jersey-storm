# Cloudflare Pages project config (free plan). Deploys come from the GitHub integration:
# every push to main builds with `node build.mjs` and serves dist/ plus the Functions in functions/.
# Local dev: `npm run dev` (builds dist/, then runs `wrangler pages dev` with the Functions).
name = "jersey-storm"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-01"

# Unique visitor counter (functions/api/visit.js). Tables are created on first use.
[[d1_databases]]
binding = "VISITS_DB"
database_name = "jersey-storm-visits"
database_id = "62c6c904-d117-4cbb-8c10-f67ec4741a6c"

# TEMP branch-only test mode: never merge
[vars]
VISIT_TEST = "1"
VISIT_TEST_UNTIL = "1792703186000"
VISIT_TEST_CLEANUP_SHA = "c5bf1668cbba1cd79e1030bc7411ad4cf353b92f97a0ddac8d3854b18f4d31a9"
